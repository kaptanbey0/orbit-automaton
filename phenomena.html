<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Phenomena Catalog — KaptanBey0 Automaton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #030308;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
      padding: 30px;
    }
    .phenomena-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99;
      background: rgba(8, 10, 16, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 16px 20px;
      border-radius: 6px;
      max-width: 400px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
    }
    .phenomena-title {
      font-size: 1.1rem;
      color: var(--neon-cyan);
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.1em;
    }
    .phenomena-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .phenomena-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--neon-green);
      font-size: 0.8rem;
      text-decoration: none;
      border: 1px solid rgba(34, 255, 136, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      margin-top: 10px;
      transition: all 0.3s;
    }
    .phenomena-nav-back:hover {
      background: rgba(34, 255, 136, 0.15);
      box-shadow: 0 0 10px rgba(34, 255, 136, 0.3);
    }
  </style>
</head>
<body>

  <!-- UI OVERLAY -->
  <div class="phenomena-overlay">
    <div class="phenomena-title">PHENOMENA CATALOG</div>
    <div class="phenomena-sub">KaptanBey0 Automaton &middot; Görsel Anomali Simülasyonu</div>
    <p style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.6;">
      3D biyolüminesans ışık ve mineral katman simülasyonu. Fareyi hareket ettirerek anomalileri inceleyin.
    </p>
    <a href="index.html" class="phenomena-nav-back">← KaptanBey0 Core Ana Sayfa</a>
  </div>

  <canvas id="c" style="position:fixed; inset:0; z-index:1;"></canvas>

  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}
  </script>
  <script type="module">
  import*as THREE from'three';
  import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';
  import{RenderPass}from'three/addons/postprocessing/RenderPass.js';
  import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030308);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 8;

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  // Glowing anomaly sphere
  const geo = new THREE.IcosahedronGeometry(2, 4);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x00f0ff,
    wireframe: true,
    emissive: 0xa855f7,
    emissiveIntensity: 0.5
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  const light = new THREE.PointLight(0x00f0ff, 2, 50);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x222244));

  function animate() {
    requestAnimationFrame(animate);
    mesh.rotation.x += 0.005;
    mesh.rotation.y += 0.008;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>

</body>
</html>
