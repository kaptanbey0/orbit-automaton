/* Loader */
#loader{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 2s cubic-bezier(.16,1,.3,1)}
#loader.out{opacity:0;pointer-events:none}
.loader-orbit{position:relative;width:80px;height:80px;margin-bottom:40px}
.loader-orbit .ring{position:absolute;inset:0;border:1.5px solid transparent;border-radius:50%}
.ring-1{border-top-color:#00f0ff;animation:spin 2s linear infinite}
.ring-2{inset:8px;border-right-color:#a855f7;animation:spin 1.4s linear infinite reverse}
.ring-3{inset:16px;border-bottom-color:#22ff88;animation:spin 1s linear infinite}
.loader-core{position:absolute;inset:24px;border-radius:50%;background:#00f0ff;filter:blur(4px);animation:pulse 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
#loader h1{font-family:'Segoe UI',sans-serif;font-weight:200;font-size:clamp(1rem,3.5vw,2rem);letter-spacing:.8em;color:#e8e8f0;text-transform:uppercase;margin-bottom:6px}
#loader h1 b{font-weight:600;color:#00f0ff}
#loader .sub{font-family:'Segoe UI',sans-serif;font-size:.6rem;letter-spacing:.5em;color:#333;text-transform:uppercase;margin-bottom:30px}

.pbar i{display:block;width:0%;height:100%;background:linear-gradient(90deg,#00f0ff,#a855f7,#22ff88);transition:width .2s}
#ltxt{font-family:'Segoe UI',sans-serif;font-size:.55rem;letter-spacing:.25em;color:#333;margin-top:14px;text-transform:uppercase}

/* Cine */
.cbar{position:fixed;left:0;right:0;background:#000;z-index:50;pointer-events:none}
.cbar-t{top:0;height:6vh}
.cbar-b{bottom:0;height:6vh}
#vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(0,0,0,.75)100%)}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 2.5s 1s}
#hud.on{opacity:1}
.h{position:absolute;font-family:'JetBrains Mono','Fira Code','Consolas',monospace;font-size:.55rem;letter-spacing:.15em;color:rgba(0,240,255,.2);text-transform:uppercase;line-height:1.6}

#commitFlash{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,240,255,.08),transparent 70%);opacity:0;transition:opacity .1s}
</style>

import*as THREE from'three';
import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';
import{RenderPass}from'three/addons/postprocessing/RenderPass.js';
import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

/* ────────── PALETTE ────────── */
const C={
  cyan:0x00f0ff, purple:0xa855f7, green:0x22ff88,
  amber:0xffaa22, pink:0xff4488, blue:0x3b82f6, white:0xe8e8f0,
};
const CN={
  cyan:new THREE.Color(C.cyan), purple:new THREE.Color(C.purple),
  green:new THREE.Color(C.green), amber:new THREE.Color(C.amber),
  pink:new THREE.Color(C.pink), blue:new THREE.Color(C.blue),
};
const cArr=[CN.cyan,CN.purple,CN.green,CN.amber,CN.pink,CN.blue];
function rc(){return cArr[Math.floor(Math.random()*cArr.length)]}
function r(a,b){return Math.random()*(b-a)+a}

/* ────────── GLOBALS ────────── */
let renderer,scene,camera,composer,clock=new THREE.Clock();
let objects=[],bridges=[],codeRivers=[],commitQueue=[];
let contribCubes,contribDummy=new THREE.Object3D();
let camPath,mouseX=0,mouseY=0;
let totalCommits=0;

/* ────────── LOAD ────────── */
function lp(v,t){document.getElementById('pb').style.width=v+'%';document.getElementById('ltxt').textContent=t}

/* ────────── RENDERER ────────── */
function initRenderer(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=.8;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);
}

/* ────────── SCENE ────────── */
function initScene(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x010108);
  scene.fog=new THREE.FogExp2(0x010108,.005);
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,800);
  camera.position.set(0,30,80);
}

/* ────────── ENV MAP ────────── */
function initEnv(){
  const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(200,32,32),new THREE.MeshBasicMaterial({color:0x030310,side:THREE.BackSide})));
  [C.cyan,C.purple,C.green].forEach((c,i)=>{const l=new THREE.PointLight(c,.3,300);l.position.set(Math.cos(i*2.1)*80,r(-40,40),Math.sin(i*2.1)*80);s.add(l)});
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(s,.04).texture;
  pm.dispose();
}

/* ────────── LIGHTING ────────── */
function initLights(){
  scene.add(new THREE.AmbientLight(0x080818,.4));

  const dir=new THREE.DirectionalLight(0x3344aa,.7);
  dir.position.set(30,60,40);dir.castShadow=true;
  dir.shadow.mapSize.set(2048,2048);
  dir.shadow.camera.left=-80;dir.shadow.camera.right=80;
  dir.shadow.camera.top=80;dir.shadow.camera.bottom=-80;
  dir.shadow.bias=-.0005;
  scene.add(dir);

  scene.add(new THREE.DirectionalLight(C.cyan,.3).translateX(-40).translateY(20).translateZ(-30));

  // Floating accent lights
  for(let i=0;i<5;i++){
    const l=new THREE.PointLight(cArr[i%cArr.length].getHex(),1.5,80);
    l.position.set(r(-60,60),r(-20,20),r(-60,60));
    scene.add(l);
    objects.push({m:l,isLight:true,v:new THREE.Vector3(r(-.3,.3),r(-.15,.15),r(-.3,.3)),b:55});
  }

  // God rays
  const rayGeo=new THREE.ConeGeometry(12,80,16,1,true);
  for(let i=0;i<4;i++){
    const ray=new THREE.Mesh(rayGeo,new THREE.MeshBasicMaterial({
      color:[C.cyan,C.purple,C.green,C.blue][i],transparent:true,opacity:r(.006,.015),
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,
    }));
    ray.position.set(r(-60,60),50,r(-60,60));
    ray.rotation.set(r(-.2,.2),0,r(-.3,.3));
    scene.add(ray);
    objects.push({m:ray,rs:new THREE.Vector3(0,r(.001,.003),r(-.001,.001)),t:'ray'});
  }
}

/* ══════════════════════════════════════════════════════
   CONTRIBUTION GRAPH — FLOATING CUBES
   ══════════════════════════════════════════════════════ */
function createContribGraph(){
  const weeks=52,days=7,total=weeks*days;

  // Generate fake contribution data
  const data=[];
  for(let i=0;i<total;i++){
    const dayOfWeek=i%7;
    const week=Math.floor(i/7);
    // Create realistic-looking patterns
    let level=Math.random();
    if(dayOfWeek===0||dayOfWeek===6)level*=.4; // weekends lower
    if(week>20&&week<35)level*=1.5; // summer more active
    level=Math.min(level,1);
    data.push(level);
  }

  // Instanced mesh for contribution cubes
  const cubeGeo=new THREE.BoxGeometry(.6,.6,.6);
  const cubeMat=new THREE.MeshStandardMaterial({
    color:0x111122,metalness:.8,roughness:.2,
  });

  contribCubes=new THREE.InstancedMesh(cubeGeo,cubeMat,total);
  contribCubes.castShadow=true;

  const color=new THREE.Color();
  const matrix=new THREE.Matrix4();

  for(let i=0;i<total;i++){
    const week=Math.floor(i/7);
    const day=i%7;
    const level=data[i];

    // Position in a curved grid that floats in space
    const angle=(week/weeks)*Math.PI*.8-Math.PI*.4;
    const radius=30+day*1.8;
    const x=Math.sin(angle)*radius;
    const y=(day-3)*1.5+Math.sin(week*.3)*2;
    const z=Math.cos(angle)*radius-30;

    contribDummy.position.set(x,y,z);
    contribDummy.rotation.set(r(-.1,.1),r(-.1,.1),r(-.1,.1));
    const scale=.3+level*1.2;
    contribDummy.scale.set(scale,scale+level*1.5,scale);
    contribDummy.updateMatrix();
    contribCubes.setMatrixAt(i,contribDummy.matrix);

    // Color based on level
    if(level<.1) color.setHex(0x0d1117);
    else if(level<.3) color.set(CN.green).multiplyScalar(.15);
    else if(level<.5) color.set(CN.green).multiplyScalar(.35);
    else if(level<.7) color.set(CN.cyan).multiplyScalar(.6);
    else color.set(CN.cyan);

    contribCubes.setColorAt(i,color);

    // Store data for animation
    contribCubes.userData[i]={
      basePos:new THREE.Vector3(x,y,z),
      level,phase:r(0,Math.PI*2),
      floatSpeed:r(.2,.6),floatAmp:r(.1,.5+level*1.5),
      baseScale:scale,
    };
  }

  contribCubes.instanceMatrix.needsUpdate=true;
  contribCubes.instanceColor.needsUpdate=true;
  scene.add(contribCubes);
}

/* ══════════════════════════════════════════════════════
   REPOSITORY ISLANDS
   ══════════════════════════════════════════════════════ */
function createRepoIslands(){
  const repos=[
    {name:'orbit-automaton',lang:'JavaScript',stars:142,x:-35,y:8,z:-20,color:C.cyan},
    {name:'discord-engine',lang:'TypeScript',stars:89,x:25,y:-5,z:-35,color:C.blue},
    {name:'roblox-framework',lang:'Lua',stars:234,x:-15,y:15,z:30,color:C.purple},
    {name:'neural-core',lang:'Python',stars:67,x:40,y:10,z:15,color:C.green},
    {name:'quantum-api',lang:'Rust',stars:45,x:-40,y:-8,z:-40,color:C.amber},
    {name:'void-engine',lang:'C++',stars:178,x:15,y:20,z:-50,color:C.pink},
  ];

  const islandGeo=new THREE.BoxGeometry(1,1,1);

  repos.forEach((repo,idx)=>{
    const group=new THREE.Group();
    group.position.set(repo.x,repo.y,repo.z);

    // Main platform — floating monolith
    const w=r(6,10),h=r(1,2),d=r(6,10);
    const platGeo=new THREE.BoxGeometry(w,h,d);
    const platMat=new THREE.MeshStandardMaterial({color:0x0a0a18,metalness:.9,roughness:.15});
    const plat=new THREE.Mesh(platGeo,platMat);
    plat.castShadow=true;plat.receiveShadow=true;
    group.add(plat);

    // Neon edges
    const edges=new THREE.LineSegments(
      new THREE.EdgesGeometry(platGeo),
      new THREE.LineBasicMaterial({color:repo.color,transparent:true,opacity:.2})
    );
    group.add(edges);

    // Holographic label
    const canvas=document.createElement('canvas');
    canvas.width=512;canvas.height=128;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='rgba(0,240,255,.03)';
    ctx.fillRect(0,0,512,128);
    ctx.strokeStyle='rgba(0,240,255,.1)';
    ctx.strokeRect(2,2,508,124);

    ctx.font='bold 24px monospace';
    ctx.fillStyle=`#${new THREE.Color(repo.color).getHexString()}`;
    ctx.fillText(repo.name,16,40);

    ctx.font='13px monospace';
    ctx.fillStyle='rgba(136,136,160,.6)';
    ctx.fillText(`${repo.lang}  ★ ${repo.stars}  ●  12 contributors`,16,70);

    // Mini bar chart
    for(let j=0;j<20;j++){
      const bh=r(5,40);
      ctx.fillStyle=`rgba(0,240,255,${r(.1,.4)})`;
      ctx.fillRect(16+j*12,100-bh,8,bh);
    }

    const tex=new THREE.CanvasTexture(canvas);
    const label=new THREE.Mesh(
      new THREE.PlaneGeometry(6,1.5),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})
    );
    label.position.set(0,2.5,0);
    label.rotation.x=-.3;
    group.add(label);

    // Floating structures on top
    for(let j=0;j<r(3,7);j++){
      const sh=r(.3,2.5);
      const struct=new THREE.Mesh(
        new THREE.BoxGeometry(r(.2,.8),sh,r(.2,.8)),
        new THREE.MeshStandardMaterial({color:0x111128,metalness:.9,roughness:.1,emissive:repo.color,emissiveIntensity:r(0,.1)})
      );
      struct.position.set(r(-w/3,w/3),h/2+sh/2,r(-d/3,d/3));
      struct.castShadow=true;
      group.add(struct);
    }

    // Point light
    const pl=new THREE.PointLight(repo.color,.8,25);
    pl.position.set(0,3,0);
    group.add(pl);

    scene.add(group);

    objects.push({
      m:group,t:'island',
      baseY:repo.y,phase:r(0,Math.PI*2),
      fs:r(.12,.25),fa:r(.3,.8),
      rs:new THREE.Vector3(0,r(-.001,.001),0),
    });
  });

  // Create bridges between islands
  createBridges(repos);
}

/* ══════════════════════════════════════════════════════
   ENERGY BRIDGES
   ══════════════════════════════════════════════════════ */
function createBridges(repos){
  const pairs=[[0,1],[1,3],[2,0],[3,5],[4,2],[5,0],[2,3],[1,4]];

  pairs.forEach(([a,b])=>{
    const ra=repos[a],rb=repos[b];
    const segs=60;
    const pts=[];
    for(let i=0;i<=segs;i++)pts.push(new THREE.Vector3(0,0,0));

    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const color=Math.random()>.5?C.cyan:C.purple;
    const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:.06,blending:THREE.AdditiveBlending,depthWrite:false});
    const line=new THREE.Line(geo,mat);
    scene.add(line);

    // Particle flowing along bridge
    const dotGeo=new THREE.SphereGeometry(.12,8,8);
    const dotMat=new THREE.MeshBasicMaterial({color,blending:THREE.AdditiveBlending,transparent:true,opacity:.6});
    const dot=new THREE.Mesh(dotGeo,dotMat);
    scene.add(dot);

    // Glow for dot
    const glowMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false});
    const glow=new THREE.Mesh(new THREE.SphereGeometry(.5,8,8),glowMat);
    dot.add(glow);

    bridges.push({
      line,geo,dot,
      start:new THREE.Vector3(ra.x,ra.y,ra.z),
      end:new THREE.Vector3(rb.x,rb.y,rb.z),
      phase:r(0,Math.PI*2),waveF:r(2,5),waveA:r(.5,2),
      dotSpeed:r(.15,.4),dotT:r(0,1),
    });
  });
}

/* ══════════════════════════════════════════════════════
   CODE RIVERS — FLOWING LIGHT STREAMS
   ══════════════════════════════════════════════════════ */
function createCodeRivers(){
  for(let i=0;i<6;i++){
    const count=400;
    const positions=new Float32Array(count*3);
    const colors=new Float32Array(count*3);
    const sizes=new Float32Array(count);
    const offsets=new Float32Array(count);

    const baseColor=rc();
    const startAngle=r(0,Math.PI*2);
    const radius=r(20,55);
    const yBase=r(-15,15);
    const speed=r(.4,.8);

    for(let j=0;j<count;j++){
      const t=j/count;
      offsets[j]=t;

      const angle=startAngle+t*Math.PI*r(1,3);
      positions[j*3]=Math.cos(angle)*radius+r(-2,2);
      positions[j*3+1]=yBase+Math.sin(t*Math.PI*4)*r(3,8)+r(-1,1);
      positions[j*3+2]=Math.sin(angle)*radius+r(-2,2);

      const c=baseColor.clone().multiplyScalar(r(.3,1));
      colors[j*3]=c.r;colors[j*3+1]=c.g;colors[j*3+2]=c.b;
      sizes[j]=r(.5,3);
    }

    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
    geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));
    geo.setAttribute('offset',new THREE.BufferAttribute(offsets,1));

    const mat=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uSpeed:{value:speed}},
      vertexShader:`
        attribute float size;
        attribute vec3 color;
        attribute float offset;
        varying vec3 vC;
        varying float vA;
        uniform float uTime;
        uniform float uSpeed;
        void main(){
          vC=color;
          float life=fract(offset+uTime*uSpeed);
          vA=sin(life*3.14159)*0.8;
          vec3 p=position;
          p.y+=sin(uTime*2.0+offset*20.0)*0.5;
          vec4 mv=modelViewMatrix*vec4(p,1.0);
          gl_PointSize=size*(200.0/-mv.z);
          gl_PointSize=clamp(gl_PointSize,0.5,12.0);
          gl_Position=projectionMatrix*mv;
        }
      `,
      fragmentShader:`
        varying vec3 vC;
        varying float vA;
        void main(){
          float d=length(gl_PointCoord-vec2(.5));
          if(d>.5)discard;
          float a=smoothstep(.5,.0,d)*vA;
          gl_FragColor=vec4(vC,a);
        }
      `,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    });

    const pts=new THREE.Points(geo,mat);
    scene.add(pts);
    codeRivers.push({pts,mat});
  }
}

/* ══════════════════════════════════════════════════════
   IMPOSSIBLE ARCHITECTURE — RECURSIVE STRUCTURES
   ══════════════════════════════════════════════════════ */
function createArchitecture(){
  // Floating monoliths
  for(let i=0;i<8;i++){
    const w=r(1,3),h=r(8,25),d=r(1,3);
    const geo=new THREE.BoxGeometry(w,h,d);
    const mat=new THREE.MeshStandardMaterial({color:0x08081a,metalness:.95,roughness:.08});
    const m=new THREE.Mesh(geo,mat);
    m.castShadow=true;

    const a=(i/8)*Math.PI*2;
    const rad=r(30,65);
    m.position.set(Math.cos(a)*rad,r(-20,20),Math.sin(a)*rad);
    m.rotation.set(r(-.4,.4),r(0,6.28),r(-.4,.4));
    scene.add(m);

    // Neon edge
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:rc().getHex(),transparent:true,opacity:.12})));

    objects.push({m,t:'monolith',baseY:m.position.y,phase:r(0,6.28),fs:r(.1,.3),fa:r(.3,1.2),rs:new THREE.Vector3(r(-.002,.002),r(-.003,.003),r(-.001,.001))});
  }

  // Crystal structures
  for(let i=0;i<5;i++){
    const group=new THREE.Group();
    const baseH=r(3,8);
    const color=rc();

    // Main crystal
    const crystalGeo=new THREE.OctahedronGeometry(r(1,3),0);
    const crystalMat=new THREE.MeshPhysicalMaterial({
      color:0xaaddff,metalness:.1,roughness:.02,
      transmission:.85,thickness:1,ior:2,
      clearcoat:1,transparent:true,opacity:.5,
    });
    const crystal=new THREE.Mesh(crystalGeo,crystalMat);
    crystal.scale.y=r(1.5,3);
    group.add(crystal);

    // Inner glow
    const innerGeo=new THREE.OctahedronGeometry(r(.3,.8),0);
    const innerMat=new THREE.MeshBasicMaterial({color:color.getHex(),transparent:true,opacity:.3,blending:THREE.AdditiveBlending});
    const inner=new THREE.Mesh(innerGeo,innerMat);
    inner.scale.y=crystal.scale.y;
    group.add(inner);

    // Orbiting fragments
    for(let j=0;j<3;j++){
      const frag=new THREE.Mesh(
        new THREE.OctahedronGeometry(r(.1,.3),0),
        new THREE.MeshStandardMaterial({emissive:color.getHex(),emissiveIntensity:2,metalness:.5,roughness:.2})
      );
      group.add(frag);
      objects.push({m:frag,t:'orbiter',parent:group,orbitR:r(1.5,3),orbitSpeed:r(.5,1.5)*(Math.random()>.5?1:-1),orbitPhase:r(0,6.28),orbitTilt:r(-.5,.5)});
    }

    group.position.set(r(-50,50),r(-15,15),r(-50,50));
    scene.add(group);

    objects.push({m:group,t:'crystal',baseY:group.position.y,phase:r(0,6.28),fs:r(.15,.35),fa:r(.4,1.5),rs:new THREE.Vector3(r(-.003,.003),r(-.005,.005),r(-.002,.002))});
  }

  // Toroidal rings (impossible geometry)
  for(let i=0;i<3;i++){
    const torusGroup=new THREE.Group();

    for(let j=0;j<3;j++){
      const torus=new THREE.Mesh(
        new THREE.TorusGeometry(r(3,7),r(.03,.1),16,80),
        new THREE.MeshStandardMaterial({emissive:cArr[(i+j)%cArr.length].getHex(),emissiveIntensity:1.5,metalness:.9,roughness:.1})
      );
      torus.rotation.set(j*Math.PI/3,j*.5,0);
      torusGroup.add(torus);
    }

    torusGroup.position.set(r(-40,40),r(-10,10),r(-40,40));
    scene.add(torusGroup);

    objects.push({m:torusGroup,t:'torusGroup',baseY:torusGroup.position.y,phase:r(0,6.28),fs:r(.1,.25),fa:r(.3,1),rs:new THREE.Vector3(r(-.004,.004),r(.005,.015),r(-.003,.003))});
  }
}

/* ══════════════════════════════════════════════════════
   LIQUID METAL BLOBS
   ══════════════════════════════════════════════════════ */
function createLiquidMetal(){
  for(let i=0;i<4;i++){
    const geo=new THREE.IcosahedronGeometry(r(.8,2),3);
    const mat=new THREE.MeshPhysicalMaterial({
      color:0x111122,metalness:1,roughness:.05,
      clearcoat:1,clearcoatRoughness:.02,
      envMapIntensity:3,
    });
    const m=new THREE.Mesh(geo,mat);
    m.position.set(r(-40,40),r(-12,12),r(-40,40));
    scene.add(m);

    // Store original vertices for morphing
    const origPos=geo.attributes.position.array.slice();

    objects.push({m,t:'blob',baseY:m.position.y,phase:r(0,6.28),fs:r(.2,.5),fa:r(.5,2),
      rs:new THREE.Vector3(r(-.003,.003),r(-.004,.004),r(-.002,.002)),
      origPos,morphSpeed:r(.3,.8),morphAmp:r(.05,.15)});
  }
}

/* ══════════════════════════════════════════════════════
   AMBIENT PARTICLES
   ══════════════════════════════════════════════════════ */
let particleSys;
function createParticles(){
  const count=5000;
  const pos=new Float32Array(count*3);
  const col=new Float32Array(count*3);
  const siz=new Float32Array(count);
  const vel=[];

  for(let i=0;i<count;i++){
    pos[i*3]=r(-100,100);pos[i*3+1]=r(-50,50);pos[i*3+2]=r(-100,100);
    const c=cArr[Math.floor(Math.random()*cArr.length)].clone().multiplyScalar(r(.2,1));
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=r(.3,2.5);
    vel.push(new THREE.Vector3(r(-.02,.02),r(-.01,.01),r(-.02,.02)));
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(siz,1));

  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`
      attribute float size;attribute vec3 color;
      varying vec3 vC;varying float vA;uniform float uTime;uniform float uPR;
      void main(){
        vC=color;
        vec4 mv=modelViewMatrix*vec4(position,1.);
        float d=length(mv.xyz);
        vA=smoothstep(120.,5.,d)*.5;
        gl_PointSize=size*uPR*(100./-mv.z);
        gl_PointSize=clamp(gl_PointSize,.3,10.);
        gl_Position=projectionMatrix*mv;
      }
    `,
    fragmentShader:`
      varying vec3 vC;varying float vA;
      void main(){
        float d=length(gl_PointCoord-vec2(.5));
        if(d>.5)discard;
        gl_FragColor=vec4(vC,smoothstep(.5,0.,d)*vA);
      }
    `,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });

  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  particleSys={pts,geo,vel,count,mat};
  document.getElementById('hParts').textContent=count;
}

/* ══════════════════════════════════════════════════════
   COMMIT EXPLOSIONS
   ══════════════════════════════════════════════════════ */
function triggerCommit(){
  totalCommits++;
  document.getElementById('hCommits').textContent=totalCommits;

  // Flash
  const flash=document.getElementById('commitFlash');
  flash.style.opacity='1';
  setTimeout(()=>flash.style.opacity='0',150);

  // Spawn burst particles
  const origin=new THREE.Vector3(r(-30,30),r(-10,10),r(-30,30));
  const burstCount=30;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(burstCount*3);
  const col=new Float32Array(burstCount*3);
  const siz=new Float32Array(burstCount);
  const vel=[];
  const c=rc();

  for(let i=0;i<burstCount;i++){
    pos[i*3]=origin.x;pos[i*3+1]=origin.y;pos[i*3+2]=origin.z;
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    siz[i]=r(1,4);
    const dir=new THREE.Vector3(r(-1,1),r(-1,1),r(-1,1)).normalize().multiplyScalar(r(.3,1.2));
    vel.push(dir);
  }

  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(siz,1));

  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`
      attribute float size;attribute vec3 color;
      varying vec3 vC;varying float vA;uniform float uPR;
      void main(){
        vC=color;
        vec4 mv=modelViewMatrix*vec4(position,1.);
        vA=smoothstep(80.,2.,length(mv.xyz));
        gl_PointSize=size*uPR*(120./-mv.z);
        gl_PointSize=clamp(gl_PointSize,.5,16.);
        gl_Position=projectionMatrix*mv;
      }
    `,
    fragmentShader:`
      varying vec3 vC;varying float vA;
      void main(){
        float d=length(gl_PointCoord-vec2(.5));
        if(d>.5)discard;
        gl_FragColor=vec4(vC,smoothstep(.5,0.,d)*vA);
      }
    `,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });

  const pts=new THREE.Points(geo,mat);
  scene.add(pts);

  // Expanding ring
  const ringGeo=new THREE.TorusGeometry(.5,.02,8,40);
  const ringMat=new THREE.MeshBasicMaterial({color:c.getHex(),transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false});
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.position.copy(origin);
  ring.rotation.set(r(0,Math.PI),r(0,Math.PI),0);
  scene.add(ring);

  commitQueue.push({pts,geo,vel,mat,ring,ringMat,born:clock.getElapsedTime(),life:3,burstCount});
}

/* ══════════════════════════════════════════════════════
   CAMERA PATH
   ══════════════════════════════════════════════════════ */
function initCamera(){
  const wp=[
    new THREE.Vector3(60,15,60),
    new THREE.Vector3(30,25,-20),
    new THREE.Vector3(-10,5,-55),
    new THREE.Vector3(-45,20,0),
    new THREE.Vector3(-25,-5,35),
    new THREE.Vector3(5,-10,20),
    new THREE.Vector3(20,30,-30),
    new THREE.Vector3(50,8,-45),
    new THREE.Vector3(35,3,0),
    new THREE.Vector3(-5,12,25),
    new THREE.Vector3(-35,18,50),
    new THREE.Vector3(20,10,55),
    new THREE.Vector3(60,15,60),
  ];
  camPath=new THREE.CatmullRomCurve3(wp,true,'centripetal',.5);
}

/* ══════════════════════════════════════════════════════
   POST PROCESSING
   ══════════════════════════════════════════════════════ */
function initPost(){
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));

  const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.4,.7,.25);
  composer.addPass(bloom);

  const fx={
    uniforms:{tDiffuse:{value:null},uTime:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform sampler2D tDiffuse;uniform float uTime;varying vec2 vUv;
      void main(){
        vec2 c=vUv-.5;float d=length(c);float o=d*.0018;
        vec4 cr=texture2D(tDiffuse,vUv+vec2(o,0.));
        vec4 cg=texture2D(tDiffuse,vUv);
        vec4 cb=texture2D(tDiffuse,vUv-vec2(o,0.));
        vec4 col=vec4(cr.r,cg.g,cb.b,1.);
        float v=1.-d*1.3;v=smoothstep(0.,1.,v);
        col.rgb*=mix(.25,1.,v);
        float g=fract(sin(dot(vUv*uTime,vec2(12.9898,78.233)))*43758.5453);
        col.rgb+=(g-.5)*.012;
        col.rgb=pow(col.rgb,vec3(.95,1.0,1.05));
        gl_FragColor=col;
      }
    `,
  };
  composer.addPass(new ShaderPass(fx));
}

/* ══════════════════════════════════════════════════════
   ANIMATION LOOP
   ══════════════════════════════════════════════════════ */
let fc=0,lt=0,fps=60;
let lastCommitTime=0;

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const dt=Math.min(clock.getDelta(),.05);

  // FPS
  fc++;
  if(t-lt>=1){fps=fc;fc=0;lt=t;document.getElementById('hFps').textContent=fps}

  /* ── Contribution cubes ── */
  if(contribCubes){
    const total=52*7;
    for(let i=0;i<total;i++){
      const d=contribCubes.userData[i];
      if(!d)continue;
      contribDummy.position.copy(d.basePos);
      contribDummy.position.y+=Math.sin(t*d.floatSpeed+d.phase)*d.floatAmp;
      contribDummy.rotation.set(
        Math.sin(t*.3+d.phase)*.08,
        Math.sin(t*.2+d.phase)*.1,
        Math.cos(t*.25+d.phase)*.06
      );
      const s=d.baseScale+Math.sin(t*1.5+d.phase)*.05*d.level;
      contribDummy.scale.set(s,s+d.level*1.5+Math.sin(t+d.phase)*.1,s);
      contribDummy.updateMatrix();
      contribCubes.setMatrixAt(i,contribDummy.matrix);
    }
    contribCubes.instanceMatrix.needsUpdate=true;
  }

  /* ── Objects ── */
  objects.forEach(o=>{
    if(o.isLight){o.m.position.addScaledVector(o.v,dt*10);['x','y','z'].forEach(a=>{if(Math.abs(o.m.position[a])>o.b)o.v[a]*=-1});return}
    if(o.t==='ray'){if(o.rs){o.m.rotation.x+=o.rs.x;o.m.rotation.y+=o.rs.y;o.m.rotation.z+=o.rs.z}return}
    if(o.t==='orbiter'){
      const angle=t*o.orbitSpeed+o.orbitPhase;
      o.m.position.set(Math.cos(angle)*o.orbitR,Math.sin(angle+o.orbitTilt)*o.orbitR*.4,Math.sin(angle)*o.orbitR);
      return;
    }
    if(o.fs!==undefined)o.m.position.y=o.baseY+Math.sin(t*o.fs+o.phase)*o.fa;
    if(o.rs){o.m.rotation.x+=o.rs.x;o.m.rotation.y+=o.rs.y;o.m.rotation.z+=o.rs.z}

    // Liquid metal morphing
    if(o.t==='blob'){
      const pos=o.m.geometry.attributes.position.array;
      for(let i=0;i<pos.length;i+=3){
        const ox=o.origPos[i],oy=o.origPos[i+1],oz=o.origPos[i+2];
        const noise=Math.sin(ox*3+t*o.morphSpeed)*Math.cos(oy*3+t*o.morphSpeed*.7)*Math.sin(oz*3+t*o.morphSpeed*1.3);
        pos[i]=ox*(1+noise*o.morphAmp);
        pos[i+1]=oy*(1+noise*o.morphAmp*1.2);
        pos[i+2]=oz*(1+noise*o.morphAmp);
      }
      o.m.geometry.attributes.position.needsUpdate=true;
      o.m.geometry.computeVertexNormals();
    }
  });

  /* ── Bridges ── */
  bridges.forEach(br=>{
    const pos=br.geo.attributes.position.array;
    const segs=pos.length/3-1;
    for(let i=0;i<=segs;i++){
      const f=i/segs;
      const mid=new THREE.Vector3().lerpVectors(br.start,br.end,f);
      const wave=Math.sin(f*br.waveF+t*2+br.phase)*br.waveA;
      const arc=Math.sin(f*Math.PI)*br.waveA*3;
      pos[i*3]=mid.x+wave*.5;pos[i*3+1]=mid.y+arc+wave*.3;pos[i*3+2]=mid.z+wave*.5;
    }
    br.geo.attributes.position.needsUpdate=true;

    // Dot flowing along bridge
    br.dotT=(br.dotT+dt*br.dotSpeed)%1;
    const dotF=br.dotT;
    const dotPos=new THREE.Vector3().lerpVectors(br.start,br.end,dotF);
    dotPos.y+=Math.sin(dotF*Math.PI)*br.waveA*3;
    br.dot.position.copy(dotPos);
  });

  /* ── Code rivers ── */
  codeRivers.forEach(cr=>{cr.mat.uniforms.uTime.value=t});

  /* ── Particles ── */
  if(particleSys){
    const p=particleSys.geo.attributes.position.array;
    for(let i=0;i<particleSys.count;i++){
      p[i*3]+=particleSys.vel[i].x;
      p[i*3+1]+=particleSys.vel[i].y+Math.sin(t*.4+i)*.001;
      p[i*3+2]+=particleSys.vel[i].z;
      if(Math.abs(p[i*3])>100)p[i*3]*=-.99;
      if(Math.abs(p[i*3+1])>50)p[i*3+1]*=-.99;
      if(Math.abs(p[i*3+2])>100)p[i*3+2]*=-.99;
    }
    particleSys.geo.attributes.position.needsUpdate=true;
    particleSys.mat.uniforms.uTime.value=t;
  }

  /* ── Commits ── */
  if(t-lastCommitTime>r(3,8)){lastCommitTime=t;triggerCommit()}

  commitQueue=commitQueue.filter(cq=>{
    const age=t-cq.born;
    if(age>cq.life){scene.remove(cq.pts);scene.remove(cq.ring);cq.geo.dispose();cq.mat.dispose();return false}
    const f=age/cq.life;
    const p=cq.geo.attributes.position.array;
    for(let i=0;i<cq.burstCount;i++){
      p[i*3]+=cq.vel[i].x*(1-f)*dt*60;
      p[i*3+1]+=cq.vel[i].y*(1-f)*dt*60;
      p[i*3+2]+=cq.vel[i].z*(1-f)*dt*60;
    }
    cq.geo.attributes.position.needsUpdate=true;

    // Expanding ring
    const rs=1+age*8;
    cq.ring.scale.set(rs,rs,rs);
    cq.ringMat.opacity=Math.max(0,.5*(1-f));
    return true;
  });

  /* ── Camera ── */
  const loopDur=100;
  const ct=(t%loopDur)/loopDur;
  const cp=camPath.getPointAt(ct);
  const cla=camPath.getPointAt((ct+.006)%1);
  camera.position.lerp(cp,.025);
  const tgt=new THREE.Vector3(cla.x+mouseX*3,cla.y+mouseY*2,cla.z);
  const curDir=new THREE.Vector3();camera.getWorldDirection(curDir);
  const desDir=tgt.clone().sub(camera.position).normalize();
  curDir.lerp(desDir,.025);
  camera.lookAt(camera.position.clone().add(curDir.multiplyScalar(10)));

  /* ── UI ── */
  const d=new Date();
  document.getElementById('hTime').textContent=d.toTimeString().split(' ')[0];

  /* ── Post-process ── */
  composer.passes.forEach(p=>{if(p.uniforms?.uTime)p.uniforms.uTime.value=t});
  composer.render();
}

/* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
async function init(){
  lp(5,'Creating renderer...');initRenderer();
  lp(10,'Building scene...');initScene();
  lp(15,'Generating environment...');initEnv();
  lp(20,'Configuring lighting...');initLights();
  lp(30,'Constructing contribution graph...');createContribGraph();
  lp(45,'Spawning repository islands...');createRepoIslands();
  lp(55,'Streaming code rivers...');createCodeRivers();
  lp(65,'Building impossible architecture...');createArchitecture();
  lp(72,'Forming liquid metal...');createLiquidMetal();
  lp(80,'Releasing particles...');createParticles();
  lp(88,'Plotting camera path...');initCamera();
  lp(94,'Applying cinematic effects...');initPost();

  const objCount=objects.length+52*7;
  document.getElementById('hObj').textContent=objCount;

  lp(100,'Entering GitHub Universe...');
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
  addEventListener('mousemove',e=>{mouseX=(e.clientX/innerWidth-.5)*2;mouseY=(e.clientY/innerHeight-.5)*2});

  await new Promise(r=>setTimeout(r,1200));
  document.getElementById('loader').classList.add('out');
  document.getElementById('hud').classList.add('on');
  clock.start();animate();
}

init();
</script>
