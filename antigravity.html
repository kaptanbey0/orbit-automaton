<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ANTIGRAVITY — Cinematic Experience</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter','Segoe UI',sans-serif}
  canvas{display:block;position:fixed;inset:0}
  
  /* Loading screen */
  #loader{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.5s cubic-bezier(.16,1,.3,1)}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader h1{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:200;letter-spacing:.6em;color:#e0e0e8;margin-bottom:32px;text-transform:uppercase}
  #loader h1 span{color:#00f0ff;font-weight:400}
  .load-bar{width:240px;height:2px;background:#111;border-radius:1px;overflow:hidden}
  .load-bar-inner{width:0%;height:100%;background:linear-gradient(90deg,#00f0ff,#a855f7);border-radius:1px;transition:width .3s}
  #loader p{margin-top:16px;font-size:.7rem;letter-spacing:.3em;color:#444;text-transform:uppercase}

  /* UI Overlay */
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 2s 1s}
  #ui.visible{opacity:1}
  .ui-corner{position:absolute;font-size:.6rem;letter-spacing:.2em;color:rgba(0,240,255,.25);font-family:'JetBrains Mono','Fira Code',monospace;text-transform:uppercase}
  .ui-tl{top:24px;left:28px}
  .ui-tr{top:24px;right:28px;text-align:right}
  .ui-bl{bottom:24px;left:28px}
  .ui-br{bottom:24px;right:28px;text-align:right}
  .ui-center{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);text-align:center}
  .ui-center p{font-size:.55rem;letter-spacing:.35em;color:rgba(255,255,255,.15)}
  
  /* Vignette */
  #vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%)}

  /* Cinematic bars */
  .cine-bar{position:fixed;left:0;right:0;height:8vh;background:#000;z-index:8;pointer-events:none}
  .cine-bar--top{top:0}
  .cine-bar--bot{bottom:0}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loader">
  <h1>ANTI<span>GRAVITY</span></h1>
  <div class="load-bar"><div class="load-bar-inner" id="load-progress"></div></div>
  <p id="load-text">Initializing world...</p>
</div>

<div id="vignette"></div>
<div class="cine-bar cine-bar--top"></div>
<div class="cine-bar cine-bar--bot"></div>

<div id="ui">
  <div class="ui-corner ui-tl">ANTIGRAVITY v1.0<br/><span id="ui-fps">60 FPS</span></div>
  <div class="ui-corner ui-tr">ORBIT AUTOMATON<br/>DARK ZENITH</div>
  <div class="ui-corner ui-bl"><span id="ui-time">00:00:00</span><br/>CINEMATIC MODE</div>
  <div class="ui-corner ui-br"><span id="ui-objects">0</span> OBJECTS<br/><span id="ui-particles">0</span> PARTICLES</div>
  <div class="ui-center"><p>▲ ANTI-GRAVITY FIELD ACTIVE ▲</p></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ═══════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════ */
const CONFIG = {
  colors: {
    cyan: 0x00f0ff,
    purple: 0xa855f7,
    green: 0x22ff88,
    amber: 0xffaa22,
    white: 0xe8e8f0,
    pink: 0xff4488,
  },
  camera: {
    fov: 45,
    near: 0.1,
    far: 600,
    speed: 0.08,
  },
  bloom: {
    strength: 1.2,
    radius: 0.6,
    threshold: 0.3,
  },
  fog: {
    near: 30,
    far: 200,
    color: 0x020208,
  },
  objects: {
    monoliths: 6,
    cubes: 14,
    shards: 30,
    orbs: 20,
    rings: 4,
    panels: 8,
    droplets: 40,
  },
  particles: 4000,
};

/* ═══════════════════════════════════════════
   GLOBALS
   ═══════════════════════════════════════════ */
let renderer, scene, camera, composer;
let clock = new THREE.Clock();
let floatingObjects = [];
let energyLines = [];
let particleSystem;
let cameraPath;
let mouseX = 0, mouseY = 0;
let loadProgress = 0;

/* ═══════════════════════════════════════════
   EASING & MATH UTILITIES
   ═══════════════════════════════════════════ */
const ease = {
  smoothstep: (t) => t * t * (3 - 2 * t),
  quintic: (t) => t * t * t * (t * (t * 6 - 15) + 10),
  sine: (t) => Math.sin(t * Math.PI * 0.5),
};

function rand(min, max) { return Math.random() * (max - min) + min; }
function randSign() { return Math.random() > 0.5 ? 1 : -1; }

function createNeonMaterial(color, emissiveIntensity = 2) {
  return new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: color,
    emissiveIntensity,
    metalness: 0.9,
    roughness: 0.1,
  });
}

function createGlassMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0x88ccff,
    metalness: 0.0,
    roughness: 0.05,
    transmission: 0.92,
    thickness: 0.5,
    ior: 1.5,
    envMapIntensity: 1.5,
    clearcoat: 1,
    clearcoatRoughness: 0.05,
    transparent: true,
    opacity: 0.6,
  });
}

function createMetallicMaterial() {
  const colors = [0x1a1a2e, 0x16162a, 0x111122, 0x0d0d1a];
  return new THREE.MeshStandardMaterial({
    color: colors[Math.floor(Math.random() * colors.length)],
    metalness: 0.95,
    roughness: 0.15,
    envMapIntensity: 2,
  });
}

/* ═══════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════ */
function updateLoading(progress, text) {
  loadProgress = progress;
  document.getElementById('load-progress').style.width = progress + '%';
  document.getElementById('load-text').textContent = text;
}

/* ═══════════════════════════════════════════
   SCENE SETUP
   ═══════════════════════════════════════════ */
function initRenderer() {
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    alpha: false,
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020208);
  scene.fog = new THREE.FogExp2(CONFIG.fog.color, 0.008);
}

function initCamera() {
  camera = new THREE.PerspectiveCamera(
    CONFIG.camera.fov,
    window.innerWidth / window.innerHeight,
    CONFIG.camera.near,
    CONFIG.camera.far
  );
  camera.position.set(0, 5, 40);
}

function initLighting() {
  // Ambient — very dim
  const ambient = new THREE.AmbientLight(0x0a0a20, 0.3);
  scene.add(ambient);

  // Key light — soft blue
  const keyLight = new THREE.DirectionalLight(0x4466aa, 0.8);
  keyLight.position.set(20, 40, 30);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 150;
  keyLight.shadow.camera.left = -50;
  keyLight.shadow.camera.right = 50;
  keyLight.shadow.camera.top = 50;
  keyLight.shadow.camera.bottom = -50;
  keyLight.shadow.bias = -0.001;
  scene.add(keyLight);

  // Rim light — cyan
  const rimLight = new THREE.DirectionalLight(CONFIG.colors.cyan, 0.4);
  rimLight.position.set(-30, 20, -20);
  scene.add(rimLight);

  // Accent light — purple
  const accentLight = new THREE.PointLight(CONFIG.colors.purple, 2, 80);
  accentLight.position.set(15, -10, -15);
  scene.add(accentLight);

  // Moving neon lights
  for (let i = 0; i < 3; i++) {
    const colors = [CONFIG.colors.cyan, CONFIG.colors.purple, CONFIG.colors.green];
    const light = new THREE.PointLight(colors[i], 1.5, 60);
    light.position.set(
      rand(-30, 30),
      rand(-15, 15),
      rand(-30, 30)
    );
    scene.add(light);
    floatingObjects.push({
      mesh: light,
      isLight: true,
      velocity: new THREE.Vector3(rand(-0.3, 0.3), rand(-0.2, 0.2), rand(-0.3, 0.3)),
      bounds: 40,
    });
  }

  // God rays (volumetric light cones)
  const coneGeo = new THREE.ConeGeometry(8, 60, 16, 1, true);
  const coneMat = new THREE.MeshBasicMaterial({
    color: CONFIG.colors.cyan,
    transparent: true,
    opacity: 0.015,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(coneGeo, coneMat.clone());
    cone.position.set(rand(-40, 40), 35, rand(-40, 40));
    cone.rotation.z = rand(-0.3, 0.3);
    cone.material.opacity = rand(0.008, 0.02);
    scene.add(cone);
    floatingObjects.push({
      mesh: cone,
      rotSpeed: new THREE.Vector3(0, rand(0.001, 0.003), rand(-0.001, 0.001)),
      type: 'godray',
    });
  }
}

function initEnvironment() {
  // Environment map (procedural)
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(100, 32, 32);
  const envMat = new THREE.MeshBasicMaterial({
    color: 0x050510,
    side: THREE.BackSide,
  });
  envScene.add(new THREE.Mesh(envGeo, envMat));

  // Add neon accent lights to env
  const envLights = [
    { color: 0x00f0ff, pos: [50, 30, 0], intensity: 0.3 },
    { color: 0xa855f7, pos: [-40, -20, 30], intensity: 0.2 },
    { color: 0x22ff88, pos: [0, -40, -50], intensity: 0.15 },
  ];
  envLights.forEach(l => {
    const pl = new THREE.PointLight(l.color, l.intensity, 200);
    pl.position.set(...l.pos);
    envScene.add(pl);
  });

  const pmrem = new THREE.PMREMGenerator(renderer);
  const envMap = pmrem.fromScene(envScene, 0.04).texture;
  scene.environment = envMap;
  pmrem.dispose();
}

/* ═══════════════════════════════════════════
   FLOATING OBJECTS
   ═══════════════════════════════════════════ */
function createMonoliths() {
  const count = CONFIG.objects.monoliths;
  for (let i = 0; i < count; i++) {
    const w = rand(1.5, 4);
    const h = rand(6, 18);
    const d = rand(1.5, 4);
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = createMetallicMaterial();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const angle = (i / count) * Math.PI * 2;
    const radius = rand(15, 45);
    mesh.position.set(
      Math.cos(angle) * radius,
      rand(-12, 12),
      Math.sin(angle) * radius
    );
    mesh.rotation.set(rand(-0.3, 0.3), rand(0, Math.PI * 2), rand(-0.3, 0.3));

    scene.add(mesh);

    // Neon edge glow
    const edges = new THREE.EdgesGeometry(geo);
    const edgeMat = new THREE.LineBasicMaterial({
      color: Math.random() > 0.5 ? CONFIG.colors.cyan : CONFIG.colors.purple,
      transparent: true,
      opacity: 0.15,
    });
    const edgeMesh = new THREE.LineSegments(edges, edgeMat);
    mesh.add(edgeMesh);

    floatingObjects.push({
      mesh,
      type: 'monolith',
      floatSpeed: rand(0.15, 0.4),
      floatAmp: rand(0.3, 1.0),
      rotSpeed: new THREE.Vector3(rand(-0.002, 0.002), rand(-0.003, 0.003), rand(-0.001, 0.001)),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
    });
  }
}

function createGlassCubes() {
  const count = CONFIG.objects.cubes;
  const glassMat = createGlassMaterial();

  for (let i = 0; i < count; i++) {
    const size = rand(0.5, 2.5);
    const geo = new THREE.BoxGeometry(size, size, size);
    const mat = glassMat.clone();
    mat.color = new THREE.Color().setHSL(rand(0.5, 0.7), 0.3, 0.6);

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-40, 40), rand(-15, 15), rand(-40, 40));
    mesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    scene.add(mesh);

    floatingObjects.push({
      mesh,
      type: 'cube',
      floatSpeed: rand(0.2, 0.6),
      floatAmp: rand(0.5, 2),
      rotSpeed: new THREE.Vector3(rand(-0.008, 0.008), rand(-0.01, 0.01), rand(-0.006, 0.006)),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
      drift: new THREE.Vector3(rand(-0.01, 0.01), 0, rand(-0.01, 0.01)),
    });
  }
}

function createShards() {
  const count = CONFIG.objects.shards;
  for (let i = 0; i < count; i++) {
    // Random triangular shard shape
    const shape = new THREE.Shape();
    const s = rand(0.3, 1.5);
    shape.moveTo(0, 0);
    shape.lineTo(s * rand(0.5, 1.5), s * rand(0.3, 0.8));
    shape.lineTo(s * rand(-0.3, 0.5), s * rand(0.8, 1.8));
    shape.lineTo(0, 0);

    const extrudeSettings = { depth: rand(0.02, 0.08), bevelEnabled: false };
    const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xaaccff,
      metalness: 0.1,
      roughness: 0.05,
      transmission: 0.85,
      thickness: 0.1,
      ior: 1.8,
      transparent: true,
      opacity: 0.4,
      side: THREE.DoubleSide,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-50, 50), rand(-20, 20), rand(-50, 50));
    mesh.rotation.set(rand(0, Math.PI * 2), rand(0, Math.PI * 2), rand(0, Math.PI * 2));
    scene.add(mesh);

    floatingObjects.push({
      mesh,
      type: 'shard',
      floatSpeed: rand(0.3, 0.8),
      floatAmp: rand(0.3, 1.5),
      rotSpeed: new THREE.Vector3(rand(-0.015, 0.015), rand(-0.02, 0.02), rand(-0.01, 0.01)),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
      drift: new THREE.Vector3(rand(-0.015, 0.015), rand(-0.005, 0.005), rand(-0.015, 0.015)),
    });
  }
}

function createOrbs() {
  const count = CONFIG.objects.orbs;
  for (let i = 0; i < count; i++) {
    const size = rand(0.15, 0.8);
    const geo = new THREE.SphereGeometry(size, 24, 24);
    const colorChoices = [CONFIG.colors.cyan, CONFIG.colors.purple, CONFIG.colors.green, CONFIG.colors.amber];
    const color = colorChoices[Math.floor(Math.random() * colorChoices.length)];

    const mat = new THREE.MeshStandardMaterial({
      color: 0x000000,
      emissive: color,
      emissiveIntensity: rand(1, 4),
      metalness: 0.3,
      roughness: 0.2,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-45, 45), rand(-18, 18), rand(-45, 45));
    scene.add(mesh);

    // Glow sphere
    const glowGeo = new THREE.SphereGeometry(size * 2.5, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.04,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    mesh.add(glow);

    floatingObjects.push({
      mesh,
      type: 'orb',
      floatSpeed: rand(0.4, 1),
      floatAmp: rand(0.5, 2.5),
      rotSpeed: new THREE.Vector3(0, 0, 0),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
      pulseSpeed: rand(0.5, 2),
      pulseMin: 0.5,
      pulseMax: 4,
      glow,
    });
  }
}

function createRings() {
  const count = CONFIG.objects.rings;
  for (let i = 0; i < count; i++) {
    const radius = rand(3, 8);
    const tube = rand(0.05, 0.15);
    const geo = new THREE.TorusGeometry(radius, tube, 16, 80);
    const color = i % 2 === 0 ? CONFIG.colors.cyan : CONFIG.colors.purple;
    const mat = createNeonMaterial(color, 1.5);

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-30, 30), rand(-10, 10), rand(-30, 30));
    mesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), 0);
    scene.add(mesh);

    floatingObjects.push({
      mesh,
      type: 'ring',
      floatSpeed: rand(0.15, 0.3),
      floatAmp: rand(0.5, 1.5),
      rotSpeed: new THREE.Vector3(rand(-0.004, 0.004), rand(0.005, 0.015), rand(-0.003, 0.003)),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
    });
  }
}

function createHoloPanels() {
  const count = CONFIG.objects.panels;
  const codeSnippets = [
    'const gravity = 0;\nfield.enable(anti);\nawait orbit.sync();',
    'fn main() {\n  let force = Vec3::zero();\n  world.simulate();\n}',
    'class Particle:\n  def update(self):\n    self.pos += self.vel\n    self.vel *= 0.99',
    'shader float4 frag() {\n  float d = length(uv);\n  return glow(d);\n}',
    'SELECT * FROM objects\nWHERE gravity = 0\nORDER BY luminosity;',
    'async function orbit() {\n  const nodes = await\n    fetch("/api/nodes");\n  return nodes;\n}',
    '10 REM ANTIGRAVITY\n20 FLOAT ALL\n30 GOTO 20',
    'import { World } from\n  "@orbit/engine";\nWorld.create({\n  gravity: false\n});',
  ];

  for (let i = 0; i < count; i++) {
    // Create canvas texture
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 320;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
    ctx.fillRect(0, 0, 512, 320);

    // Border
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(2, 2, 508, 316);

    // Scan line
    ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.fillRect(0, 0, 512, 1);

    // Header
    ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.font = '11px monospace';
    ctx.fillText('ORBIT://SYSTEM/' + Math.floor(Math.random() * 999).toString().padStart(3, '0'), 12, 20);

    // Code text
    ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.font = '14px monospace';
    const snippet = codeSnippets[i % codeSnippets.length];
    snippet.split('\n').forEach((line, j) => {
      ctx.fillText(line, 16, 50 + j * 22);
    });

    // Stats
    ctx.fillStyle = 'rgba(168, 85, 247, 0.3)';
    ctx.fillText('▓'.repeat(Math.floor(Math.random() * 15) + 5), 16, 280);

    const texture = new THREE.CanvasTexture(canvas);
    const geo = new THREE.PlaneGeometry(rand(2.5, 5), rand(1.5, 3));
    const mat = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-35, 35), rand(-12, 12), rand(-35, 35));
    mesh.rotation.set(rand(-0.3, 0.3), rand(0, Math.PI * 2), rand(-0.1, 0.1));
    scene.add(mesh);

    floatingObjects.push({
      mesh,
      type: 'panel',
      floatSpeed: rand(0.2, 0.5),
      floatAmp: rand(0.3, 1),
      rotSpeed: new THREE.Vector3(rand(-0.002, 0.002), rand(-0.005, 0.005), rand(-0.001, 0.001)),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
      flickerSpeed: rand(2, 6),
    });
  }
}

function createDroplets() {
  const count = CONFIG.objects.droplets;
  for (let i = 0; i < count; i++) {
    const size = rand(0.08, 0.25);
    const geo = new THREE.SphereGeometry(size, 12, 12);
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xccddff,
      metalness: 0,
      roughness: 0,
      transmission: 0.95,
      thickness: size,
      ior: 1.33,
      clearcoat: 1,
      transparent: true,
      opacity: 0.7,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(rand(-40, 40), rand(-15, 15), rand(-40, 40));
    scene.add(mesh);

    floatingObjects.push({
      mesh,
      type: 'droplet',
      floatSpeed: rand(0.3, 0.9),
      floatAmp: rand(0.3, 1.5),
      rotSpeed: new THREE.Vector3(0, 0, 0),
      baseY: mesh.position.y,
      phase: rand(0, Math.PI * 2),
      wobbleSpeed: rand(2, 5),
      wobbleAmp: rand(0.01, 0.05),
    });
  }
}

/* ═══════════════════════════════════════════
   ENERGY CONNECTIONS
   ═══════════════════════════════════════════ */
function createEnergyLines() {
  const lineCount = 12;
  for (let i = 0; i < lineCount; i++) {
    const points = [];
    const segmentCount = 30;
    for (let j = 0; j <= segmentCount; j++) {
      points.push(new THREE.Vector3(0, 0, 0));
    }

    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: Math.random() > 0.5 ? CONFIG.colors.cyan : CONFIG.colors.purple,
      transparent: true,
      opacity: 0.08,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const line = new THREE.Line(geo, mat);
    scene.add(line);

    energyLines.push({
      line,
      geo,
      startObj: Math.floor(rand(0, Math.min(floatingObjects.length, 30))),
      endObj: Math.floor(rand(0, Math.min(floatingObjects.length, 30))),
      phase: rand(0, Math.PI * 2),
      waveFreq: rand(2, 6),
      waveAmp: rand(0.2, 1),
    });
  }
}

/* ═══════════════════════════════════════════
   PARTICLE SYSTEM
   ═══════════════════════════════════════════ */
function createParticles() {
  const count = CONFIG.particles;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const velocities = [];

  const colorOptions = [
    new THREE.Color(CONFIG.colors.cyan),
    new THREE.Color(CONFIG.colors.purple),
    new THREE.Color(CONFIG.colors.green),
    new THREE.Color(0x334466),
    new THREE.Color(0x222244),
  ];

  for (let i = 0; i < count; i++) {
    positions[i * 3] = rand(-80, 80);
    positions[i * 3 + 1] = rand(-40, 40);
    positions[i * 3 + 2] = rand(-80, 80);

    const color = colorOptions[Math.floor(Math.random() * colorOptions.length)];
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;

    sizes[i] = rand(0.3, 2.0);

    velocities.push(new THREE.Vector3(
      rand(-0.02, 0.02),
      rand(-0.01, 0.01),
      rand(-0.02, 0.02)
    ));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  // Custom shader for soft particles
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPixelRatio;

      void main() {
        vColor = color;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        float dist = length(mvPos.xyz);
        vAlpha = smoothstep(100.0, 10.0, dist) * 0.6;
        gl_PointSize = size * uPixelRatio * (80.0 / -mvPos.z);
        gl_PointSize = max(gl_PointSize, 0.5);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);

  particleSystem = { points, geo, velocities, count };
}

/* ═══════════════════════════════════════════
   CAMERA CHOREOGRAPHY
   ═══════════════════════════════════════════ */
function initCameraPath() {
  // Define cinematic waypoints
  const waypoints = [
    // Wide establishing orbit
    new THREE.Vector3(40, 8, 40),
    new THREE.Vector3(30, 12, -25),
    new THREE.Vector3(-20, 5, -40),
    new THREE.Vector3(-40, 15, 10),
    // Dive through structures
    new THREE.Vector3(-15, -5, 25),
    new THREE.Vector3(5, -8, 10),
    // Rise up and orbit
    new THREE.Vector3(15, 20, -15),
    new THREE.Vector3(35, 10, -30),
    // Macro pass
    new THREE.Vector3(20, 2, -5),
    new THREE.Vector3(-10, 8, 15),
    // Pull back to start
    new THREE.Vector3(-30, 12, 35),
    new THREE.Vector3(10, 6, 45),
    new THREE.Vector3(40, 8, 40), // Loop back
  ];

  cameraPath = new THREE.CatmullRomCurve3(waypoints, true, 'centripetal', 0.5);
}

function updateCamera(time) {
  const loopDuration = 120; // seconds for full loop
  const t = (time % loopDuration) / loopDuration;

  const pos = cameraPath.getPointAt(t);
  const lookAheadT = (t + 0.008) % 1;
  const lookAt = cameraPath.getPointAt(lookAheadT);

  // Smooth interpolation
  camera.position.lerp(pos, 0.02);

  // Mouse parallax
  const parallaxX = mouseX * 2;
  const parallaxY = mouseY * 1.5;

  const target = new THREE.Vector3(
    lookAt.x + parallaxX,
    lookAt.y + parallaxY,
    lookAt.z
  );

  // Smooth look-at
  const currentLook = new THREE.Vector3();
  camera.getWorldDirection(currentLook);
  const desiredLook = target.clone().sub(camera.position).normalize();
  currentLook.lerp(desiredLook, 0.03);
  camera.lookAt(camera.position.clone().add(currentLook.multiplyScalar(10)));
}

/* ═══════════════════════════════════════════
   POST PROCESSING
   ═══════════════════════════════════════════ */
function initPostProcessing() {
  composer = new EffectComposer(renderer);

  // Render pass
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  // Bloom
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    CONFIG.bloom.strength,
    CONFIG.bloom.radius,
    CONFIG.bloom.threshold
  );
  composer.addPass(bloomPass);

  // Chromatic aberration + vignette + film grain
  const chromaticShader = {
    uniforms: {
      tDiffuse: { value: null },
      uTime: { value: 0 },
      uIntensity: { value: 0.002 },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uTime;
      uniform float uIntensity;
      varying vec2 vUv;

      void main() {
        vec2 center = vUv - 0.5;
        float dist = length(center);
        float offset = dist * uIntensity;

        vec4 cr = texture2D(tDiffuse, vUv + vec2(offset, 0.0));
        vec4 cg = texture2D(tDiffuse, vUv);
        vec4 cb = texture2D(tDiffuse, vUv - vec2(offset, 0.0));

        vec4 color = vec4(cr.r, cg.g, cb.b, 1.0);

        // Vignette
        float vig = 1.0 - dist * 1.2;
        vig = smoothstep(0.0, 1.0, vig);
        color.rgb *= mix(0.3, 1.0, vig);

        // Subtle film grain
        float grain = fract(sin(dot(vUv * uTime, vec2(12.9898, 78.233))) * 43758.5453);
        color.rgb += (grain - 0.5) * 0.015;

        // Subtle color grade — slight teal in shadows, warm highlights
        color.rgb = pow(color.rgb, vec3(0.95, 1.0, 1.05));

        gl_FragColor = color;
      }
    `,
  };

  const chromaticPass = new ShaderPass(chromaticShader);
  composer.addPass(chromaticPass);
}

/* ═══════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════ */
let frameCount = 0;
let lastFpsTime = 0;
let fps = 60;

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  const delta = clock.getDelta();

  // FPS counter
  frameCount++;
  if (elapsed - lastFpsTime >= 1) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = elapsed;
    document.getElementById('ui-fps').textContent = fps + ' FPS';
  }

  // Update floating objects
  floatingObjects.forEach(obj => {
    if (obj.isLight) {
      obj.mesh.position.add(obj.velocity.clone().multiplyScalar(delta * 10));
      // Bounce off bounds
      ['x', 'y', 'z'].forEach(axis => {
        if (Math.abs(obj.mesh.position[axis]) > obj.bounds) {
          obj.velocity[axis] *= -1;
        }
      });
      return;
    }

    if (obj.type === 'godray') {
      obj.mesh.rotation.x += obj.rotSpeed.x;
      obj.mesh.rotation.y += obj.rotSpeed.y;
      obj.mesh.rotation.z += obj.rotSpeed.z;
      return;
    }

    // Float motion
    if (obj.floatSpeed !== undefined) {
      obj.mesh.position.y = obj.baseY + Math.sin(elapsed * obj.floatSpeed + obj.phase) * obj.floatAmp;
    }

    // Rotation
    if (obj.rotSpeed) {
      obj.mesh.rotation.x += obj.rotSpeed.x;
      obj.mesh.rotation.y += obj.rotSpeed.y;
      obj.mesh.rotation.z += obj.rotSpeed.z;
    }

    // Drift
    if (obj.drift) {
      obj.mesh.position.x += obj.drift.x;
      obj.mesh.position.z += obj.drift.z;

      // Wrap around bounds
      if (obj.mesh.position.x > 55) obj.mesh.position.x = -55;
      if (obj.mesh.position.x < -55) obj.mesh.position.x = 55;
      if (obj.mesh.position.z > 55) obj.mesh.position.z = -55;
      if (obj.mesh.position.z < -55) obj.mesh.position.z = 55;
    }

    // Orb pulsing
    if (obj.type === 'orb' && obj.pulseSpeed) {
      const pulse = (Math.sin(elapsed * obj.pulseSpeed + obj.phase) + 1) * 0.5;
      obj.mesh.material.emissiveIntensity = obj.pulseMin + pulse * (obj.pulseMax - obj.pulseMin);
      if (obj.glow) {
        obj.glow.material.opacity = 0.02 + pulse * 0.04;
      }
    }

    // Panel flicker
    if (obj.type === 'panel' && obj.flickerSpeed) {
      const flicker = Math.sin(elapsed * obj.flickerSpeed) * 0.15 + 0.55;
      obj.mesh.material.opacity = flicker;
    }

    // Droplet wobble
    if (obj.type === 'droplet' && obj.wobbleSpeed) {
      const wobble = Math.sin(elapsed * obj.wobbleSpeed) * obj.wobbleAmp;
      obj.mesh.scale.set(1 + wobble, 1 - wobble * 0.5, 1 + wobble);
    }
  });

  // Update energy lines
  energyLines.forEach(el => {
    const startIdx = el.startObj % floatingObjects.length;
    const endIdx = el.endObj % floatingObjects.length;
    const startPos = floatingObjects[startIdx]?.mesh?.position;
    const endPos = floatingObjects[endIdx]?.mesh?.position;

    if (!startPos || !endPos) return;

    const positions = el.geo.attributes.position.array;
    const segCount = positions.length / 3 - 1;

    for (let i = 0; i <= segCount; i++) {
      const t = i / segCount;
      const mid = new THREE.Vector3().lerpVectors(startPos, endPos, t);

      // Add wave
      const wave = Math.sin(t * el.waveFreq + elapsed * 2 + el.phase) * el.waveAmp;
      const perpX = (endPos.z - startPos.z);
      const perpZ = -(endPos.x - startPos.x);
      const perpLen = Math.sqrt(perpX * perpX + perpZ * perpZ) || 1;

      positions[i * 3] = mid.x + (perpX / perpLen) * wave;
      positions[i * 3 + 1] = mid.y + Math.sin(t * Math.PI) * el.waveAmp * 2 + wave * 0.5;
      positions[i * 3 + 2] = mid.z + (perpZ / perpLen) * wave;
    }

    el.geo.attributes.position.needsUpdate = true;
  });

  // Update particles
  if (particleSystem) {
    const positions = particleSystem.geo.attributes.position.array;
    for (let i = 0; i < particleSystem.count; i++) {
      positions[i * 3] += particleSystem.velocities[i].x;
      positions[i * 3 + 1] += particleSystem.velocities[i].y + Math.sin(elapsed * 0.5 + i) * 0.002;
      positions[i * 3 + 2] += particleSystem.velocities[i].z;

      // Wrap
      if (Math.abs(positions[i * 3]) > 80) positions[i * 3] *= -0.99;
      if (Math.abs(positions[i * 3 + 1]) > 40) positions[i * 3 + 1] *= -0.99;
      if (Math.abs(positions[i * 3 + 2]) > 80) positions[i * 3 + 2] *= -0.99;
    }
    particleSystem.geo.attributes.position.needsUpdate = true;
    particleSystem.points.material.uniforms.uTime.value = elapsed;
  }

  // Update camera
  updateCamera(elapsed);

  // Update post-processing uniforms
  composer.passes.forEach(pass => {
    if (pass.uniforms && pass.uniforms.uTime) {
      pass.uniforms.uTime.value = elapsed;
    }
  });

  // Update UI
  const date = new Date();
  document.getElementById('ui-time').textContent =
    date.toTimeString().split(' ')[0];

  // Render
  composer.render();
}

/* ═══════════════════════════════════════════
   RESIZE & INPUT
   ═══════════════════════════════════════════ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseMove(e) {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
async function init() {
  updateLoading(5, 'Creating renderer...');
  initRenderer();

  updateLoading(10, 'Building scene...');
  initScene();
  initCamera();

  updateLoading(15, 'Generating environment...');
  initEnvironment();

  updateLoading(20, 'Configuring lighting...');
  initLighting();

  updateLoading(30, 'Constructing monoliths...');
  createMonoliths();

  updateLoading(40, 'Forming glass structures...');
  createGlassCubes();

  updateLoading(50, 'Shattering reality...');
  createShards();

  updateLoading(58, 'Igniting energy orbs...');
  createOrbs();

  updateLoading(64, 'Warping orbital rings...');
  createRings();

  updateLoading(70, 'Projecting holograms...');
  createHoloPanels();

  updateLoading(75, 'Suspending droplets...');
  createDroplets();

  updateLoading(80, 'Threading energy connections...');
  createEnergyLines();

  updateLoading(85, 'Releasing particles...');
  createParticles();

  updateLoading(90, 'Plotting camera path...');
  initCameraPath();

  updateLoading(95, 'Applying cinematic effects...');
  initPostProcessing();

  // Update UI counts
  let objectCount = floatingObjects.filter(o => !o.isLight && o.type !== 'godray').length;
  document.getElementById('ui-objects').textContent = objectCount;
  document.getElementById('ui-particles').textContent = CONFIG.particles;

  // Events
  window.addEventListener('resize', onResize);
  window.addEventListener('mousemove', onMouseMove);

  updateLoading(100, 'Entering anti-gravity field...');

  // Hide loader
  await new Promise(r => setTimeout(r, 800));
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('ui').classList.add('visible');

  // Start animation
  clock.start();
  animate();
}

init();
</script>
