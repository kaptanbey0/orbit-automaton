<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg-rad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <filter id="g1">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g3">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="400" height="400" rx="40" fill="url(#bg-rad)"/>

  <!-- Ambient particles -->
  <g opacity="0.25">
    <circle cx="80" cy="70" r="1.2" fill="#00f0ff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="90" r="0.8" fill="#a855f7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="320" r="1" fill="#a855f7"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="310" r="1.3" fill="#00f0ff"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="50" r="0.7" fill="#00f0ff"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="350" r="0.9" fill="#a855f7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(200, 185)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.08">
      <animate attributeName="r" values="88;92;88" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit ring 3 (outermost, tilted) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="82" ry="28" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.2" transform="rotate(20)" filter="url(#g2)"/>
      <circle cx="82" cy="0" r="3" fill="#00f0ff" opacity="0.5" transform="rotate(20)" filter="url(#g2)">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit ring 2 (middle) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="62" ry="22" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.45" filter="url(#g2)"/>
      <!-- Electron -->
      <circle cx="62" cy="0" r="4.5" fill="#00f0ff" filter="url(#g1)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit ring 1 (inner, reverse) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="40" ry="16" fill="none" stroke="#a855f7" stroke-width="1.4" opacity="0.55" filter="url(#g2)"/>
      <!-- Electron -->
      <circle cx="-40" cy="0" r="4" fill="#a855f7" filter="url(#g1)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Core outer glow -->
    <circle cx="0" cy="0" r="22" fill="#00f0ff" opacity="0.04" filter="url(#g3)">
      <animate attributeName="r" values="22;28;22" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="14" fill="#00f0ff" opacity="0.08" filter="url(#g3)">
      <animate attributeName="r" values="14;18;14" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Core -->
    <circle cx="0" cy="0" r="8" fill="#00f0ff" filter="url(#g1)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Username text -->
  <text x="200" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#e8e8f0" text-anchor="middle" letter-spacing="3">
    KAPTANBEY0
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="200" y="335" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#00f0ff" text-anchor="middle" letter-spacing="5" opacity="0.7">
    ORBIT AUTOMATON
    <animate attributeName="opacity" values="0;0.7" dur="1.5s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#00f0ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="30" y1="30" x2="30" y2="70" stroke="#00f0ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="370" y1="30" x2="330" y2="30" stroke="#a855f7" stroke-width="0.6" opacity="0.2"/>
  <line x1="370" y1="30" x2="370" y2="70" stroke="#a855f7" stroke-width="0.6" opacity="0.2"/>
  <line x1="30" y1="370" x2="70" y2="370" stroke="#a855f7" stroke-width="0.6" opacity="0.2"/>
  <line x1="30" y1="370" x2="30" y2="330" stroke="#a855f7" stroke-width="0.6" opacity="0.2"/>
  <line x1="370" y1="370" x2="330" y2="370" stroke="#00f0ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="370" y1="370" x2="370" y2="330" stroke="#00f0ff" stroke-width="0.6" opacity="0.2"/>
</svg>
