<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <filter id="cg">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cg2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="200" rx="16" fill="url(#cbg)" stroke="#1a1a28" stroke-width="1"/>

  <!-- Left: Mini orbit animation -->
  <g transform="translate(90, 100)">
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.4" filter="url(#cg2)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="24" ry="10" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5" filter="url(#cg2)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="36" cy="0" r="2.5" fill="#00f0ff" filter="url(#cg2)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-24" cy="0" r="2" fill="#a855f7" filter="url(#cg2)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#00f0ff" filter="url(#cg)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Vertical separator -->
  <line x1="175" y1="40" x2="175" y2="160" stroke="#1a1a28" stroke-width="1"/>

  <!-- Name & title -->
  <text x="205" y="68" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e8e8f0" letter-spacing="1">kaptanbey0</text>
  <text x="205" y="92" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8888a0" letter-spacing="2">DEVELOPER · AUTOMATOR</text>

  <!-- Status indicator -->
  <circle cx="210" cy="120" r="4" fill="#22ff88" filter="url(#cg2)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="222" y="124" font-family="'Segoe UI', sans-serif" font-size="11" fill="#22ff88" letter-spacing="1">ÇEVRİMİÇİ</text>

  <!-- Tech tags -->
  <g transform="translate(205, 145)">
    <rect x="0" y="0" width="72" height="22" rx="4" fill="#00f0ff" opacity="0.08" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="36" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="500">JavaScript</text>

    <rect x="82" y="0" width="45" height="22" rx="4" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="104.5" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a855f7" text-anchor="middle" font-weight="500">Lua</text>

    <rect x="137" y="0" width="58" height="22" rx="4" fill="#22ff88" opacity="0.08" stroke="#22ff88" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="166" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#22ff88" text-anchor="middle" font-weight="500">Python</text>

    <rect x="205" y="0" width="72" height="22" rx="4" fill="#ffaa22" opacity="0.08" stroke="#ffaa22" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="241" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ffaa22" text-anchor="middle" font-weight="500">Discord.js</text>

    <rect x="287" y="0" width="62" height="22" rx="4" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="318" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="500">Roblox</text>
  </g>

  <!-- Right side: Stats -->
  <g transform="translate(580, 55)">
    <!-- Repos -->
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#00f0ff" filter="url(#cg2)">
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
      ∞
    </text>
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#555566" letter-spacing="1">PROJELERİ</text>

    <!-- Commits -->
    <text x="90" y="0" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#a855f7" filter="url(#cg2)">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
      ⚡
    </text>
    <text x="90" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#555566" letter-spacing="1">AKTİF</text>

    <!-- Stars -->
    <text x="170" y="0" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#22ff88" filter="url(#cg2)">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
      ★
    </text>
    <text x="170" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#555566" letter-spacing="1">YILDIZ</text>
  </g>

  <!-- Quote -->
  <text x="580" y="120" font-family="'Segoe UI', sans-serif" font-size="11" fill="#555566" font-style="italic">
    "Kodun yörüngesini kontrol et." 🛸
  </text>

  <!-- Animated scan line -->
  <rect x="1" y="0" width="838" height="1.5" rx="1" fill="#00f0ff" opacity="0.03">
    <animate attributeName="y" values="0;198;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <polyline points="10,3 3,3 3,10" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.3"/>
  <polyline points="830,3 837,3 837,10" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.3"/>
  <polyline points="10,197 3,197 3,190" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.3"/>
  <polyline points="830,197 837,197 837,190" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.3"/>
</svg>
