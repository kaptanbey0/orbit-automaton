<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <filter id="sg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg2">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar-cyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22ff88" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="skyline-clip"><rect x="50" y="30" width="740" height="200"/></clipPath>
  </defs>

